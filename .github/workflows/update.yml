name: Daily research update and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths: ['index.html','style.css','script.js','update.py','sources.json','.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - name: Preserve history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || (git commit -m 'Update research resources' && git push)
      - uses: actions/configure-pages@v5
      - run: mkdir -p _site && cp index.html style.css script.js data.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
